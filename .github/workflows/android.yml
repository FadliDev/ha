name: Liquid Client APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Source zip tidak membawa git submodule, jadi native deps di-clone manual
      # pada commit yang sama dengan upstream LeviLaunchroid.
      - name: Fetch native submodules (preloader, libHttpClient)
        run: |
          set -euo pipefail
          rm -rf app/src/main/cpp/preloader app/src/main/cpp/libHttpClient
          git clone https://github.com/LiteLDev/preloader-android app/src/main/cpp/preloader
          git -C app/src/main/cpp/preloader checkout 5d108da350ce3e7f13f51415f81e65344ecd5d14
          git -C app/src/main/cpp/preloader submodule update --init --recursive || true
          git clone https://github.com/microsoft/libHttpClient app/src/main/cpp/libHttpClient
          git -C app/src/main/cpp/libHttpClient checkout f8ae1d9cf931d9d55542865eee395adca5bdbe41
          git -C app/src/main/cpp/libHttpClient submodule update --init --recursive

      - name: Prepare google-services.json (placeholder)
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "liquidclient-placeholder",
              "storage_bucket": "liquidclient-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.sally.liquidclient" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyCIOnlyPlaceholderKey" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept licenses and install build tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;35.0.0" "platforms;android-36"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidClient-debug-apk
          path: app/build/outputs/apk/debug/*.apk
